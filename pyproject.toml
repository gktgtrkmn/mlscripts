[project]
name = "mlscripts"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "scikit-learn>=1.8.0",
  "tinygrad>=0.12.0",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "xgboost>=2.1.0",
  "matplotlib>=3.9.0",
  "umap-learn>=0.5.7",
  "jupyter>=1.1.0",
  "ipykernel>=6.29.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
